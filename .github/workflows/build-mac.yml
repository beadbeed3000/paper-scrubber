name: Build the De-Identifier desktop apps

# Builds the desktop app for macOS AND Windows on real machines of each kind,
# gates every build on a boot test plus an actual de-identify run inside the
# packaged stack, then publishes both installers to one GitHub Release.
# No certificates on either platform. The Mac app is ad-hoc signed (an Apple
# Silicon Mac calls an app with a broken signature "damaged" and offers no way
# past it); first launch is System Settings -> Privacy & Security -> Open Anyway.
# Windows is unsigned: SmartScreen -> More info -> Run anyway.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      # the installers bundle the engine — any engine change must rebuild them
      - 'app.js'
      - 'deep-check-worker.mjs'
      - 'labels.js'
      - 'sample.js'
      - 'styles.css'
      - 'deid/**'
      - 'models/**'
      - 'vendor/**'
      - '.github/workflows/build-mac.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip (Apple Silicon)
          - os: windows-latest
            args: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false   # no lockfile in the repo to key a cache on

      - name: Assemble the web bundle (page + engine + BOTH models)
        shell: bash
        run: |
          mkdir -p desktop/webapp desktop/build
          for d in deid icons models vendor; do cp -r "$d" desktop/webapp/; done
          for f in app.js styles.css labels.js sample.js deep-check-worker.mjs \
                   privacy.html index.html sw.js manifest.webmanifest manifest-deid.webmanifest; do
            cp "$f" desktop/webapp/
          done
          cp icons/deid-512.png desktop/build/icon.png
          cp icons/deid.ico desktop/build/icon.ico
          du -sh desktop/webapp

      - name: Install Electron
        working-directory: desktop
        run: npm install

      - name: Smoke test — the app must boot and load the tool
        working-directory: desktop
        run: npx electron . --smoke

      - name: Release gate — a real de-identify run inside the app, offline
        working-directory: desktop
        run: npx electron . --scrub-test

      - name: Release gate — the detection rule cases (fixed leaks stay fixed)
        working-directory: desktop
        timeout-minutes: 20
        run: npx electron . --rule-test=../tests/rule-cases.json

      - name: Build the Windows installer (unsigned)
        if: runner.os == 'Windows'
        working-directory: desktop
        timeout-minutes: 30   # normally ~2; a hang should fail, not burn six hours
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      # The Mac build runs in three steps so a stall shows which part it is in:
      # step timings are public, the log needs a GitHub sign-in.
      - name: Mac — package the app and ad-hoc sign it
        if: runner.os == 'macOS'
        working-directory: desktop
        timeout-minutes: 20
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --arm64 --publish never

      - name: Mac — the app must carry a valid ad-hoc signature
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          APP="$(ls -d dist/mac*/De-Identifier.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | tee sig.txt
          grep -q 'Signature=adhoc' sig.txt

      - name: Mac — disk image and zip from the signed app
        if: runner.os == 'macOS'
        working-directory: desktop
        timeout-minutes: 20
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --prepackaged "$(ls -d dist/mac*/De-Identifier.app | head -1)" --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          retention-days: 3
          path: |
            desktop/dist/*.dmg
            desktop/dist/*-mac.zip
            desktop/dist/De-Identifier-Setup-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Publish one release with both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-b${{ github.run_number }}"
          ls -la dist/
          gh release create "$TAG" dist/* \
            -R "${{ github.repository }}" \
            --title "De-Identifier for Mac & Windows (build ${{ github.run_number }})" \
            --latest \
            --notes "The De-Identifier as a desktop program — both AIs ship inside, no downloads, no internet, ever. **Mac** (Apple chip, M1 or newer, on macOS 12 Monterey or newer): open the .dmg, drag De-Identifier to Applications; the first time, the Mac refuses to open it: go to System Settings → Privacy & Security, click Open Anyway, and confirm (not Apple-notarized yet). **Windows**: run De-Identifier-Setup (installs per-user, no admin rights needed); if SmartScreen appears, More info → Run anyway. Includes the watched scans folder: point it at wherever the scanner saves, and every new scan de-identifies itself."
