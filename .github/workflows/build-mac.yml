name: Build the De-Identifier desktop apps

# Builds the desktop app for macOS AND Windows on real machines of each kind,
# gates every build on a boot test plus an actual de-identify run inside the
# packaged stack, then publishes both installers to one GitHub Release.
# Unsigned on both platforms (no Apple cert, no Windows cert): Mac first launch
# is right-click -> Open; Windows shows SmartScreen -> More info -> Run anyway.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-mac.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip
          - os: windows-latest
            args: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble the web bundle (page + engine + BOTH models)
        shell: bash
        run: |
          mkdir -p desktop/webapp desktop/build
          for d in deid icons models vendor; do cp -r "$d" desktop/webapp/; done
          for f in app.js styles.css labels.js sample.js deep-check-worker.mjs \
                   privacy.html index.html sw.js manifest.webmanifest manifest-deid.webmanifest; do
            cp "$f" desktop/webapp/
          done
          cp icons/deid-512.png desktop/build/icon.png
          cp icons/deid.ico desktop/build/icon.ico
          du -sh desktop/webapp

      - name: Install Electron
        working-directory: desktop
        run: npm install

      - name: Smoke test — the app must boot and load the tool
        working-directory: desktop
        run: npx electron . --smoke

      - name: Release gate — a real de-identify run inside the app, offline
        working-directory: desktop
        run: npx electron . --scrub-test

      - name: Build installers (unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          retention-days: 3
          path: |
            desktop/dist/*.dmg
            desktop/dist/*-mac.zip
            desktop/dist/De-Identifier-Setup-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish one release with both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-b${{ github.run_number }}"
          ls -la dist/
          gh release create "$TAG" dist/* \
            -R "${{ github.repository }}" \
            --title "De-Identifier for Mac & Windows (build ${{ github.run_number }})" \
            --latest \
            --notes "The De-Identifier as a desktop program — both AIs ship inside, no downloads, no internet, ever. **Mac**: open the .dmg, drag De-Identifier to Applications; first launch is right-click → Open → Open (not Apple-notarized yet). **Windows**: run De-Identifier-Setup (installs per-user, no admin rights needed); if SmartScreen appears, More info → Run anyway. Includes the watched scans folder: point it at wherever the scanner saves, and every new scan de-identifies itself."
